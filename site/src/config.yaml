site:
  name: meshin.co
  site: 'https://meshin.co'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: JzDVNYl7fyNlWq2UAtXGzgKmxjemBpi44BYH1_ahKgY

# Default SEO metadata
metadata:
  title:
    default: 'Fractional Chief AI Officer'
  description: 'Fractional AI leadership for 30–300 person companies: AI governance that passes procurement and agentic automation shipped to production.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: meshin.co
    images:
      - url: '~/assets/images/og-default.png'
        width: 1200
        height: 630
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 12

    post:
      isEnabled: true
      permalink: '/blog/%slug%'
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'blog/category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'blog/tag'
      robots:
        index: true

    isRelatedPostsEnabled: true
    relatedPostsCount: 3

ui:
  theme: 'system'
