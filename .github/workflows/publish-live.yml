name: Publish Live

run-name: Publish Live by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      ci_run:
        description: Leave empty to put the newest fully tested build of main live. A CI run number serves that run's stored files instead - refused once main has changed any file that is not prose, workflows and tests included, so it cannot undo a release.
        required: false

defaults:
  run:
    working-directory: site

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: find the gated build this press may publish
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/run-publish-target.mjs "${{ github.repository }}" "${{ inputs.ci_run }}"

      - name: take the deploy scripts and the route ledger from that same commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: take the measurement evidence from the tip of main, because a record committed after the gated run is prose and the run's own commit cannot hold it
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.sha }}"
          git restore --source=FETCH_HEAD --worktree -- :/audits/lighthouse-green.json :/audits/autowriter

      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci

      - name: publish the very bytes those gates measured, never a second build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: site/dist
          run-id: ${{ steps.target.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: npm run deploy

      - name: smoke the production origin, because only a live response proves the headers
        run: npm run smoke:prod "https://${{ vars.CLOUDFLARE_PAGES_PROJECT }}.pages.dev"

      - name: restore which entries were already announced as live
        uses: actions/cache/restore@v4
        with:
          path: site/.live-entries.json
          key: live-entries-${{ github.run_id }}
          restore-keys: live-entries-

      - name: say which entries are live, once the live origin answers for their pages
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/live-entry.mjs --dist dist --state .live-entries.json

      - name: remember which entries were announced, before any later step can fail the job
        uses: actions/cache/save@v4
        with:
          path: site/.live-entries.json
          key: live-entries-${{ github.run_id }}

      - name: restore the route set last announced to indexnow
        uses: actions/cache@v4
        with:
          path: site/.indexnow-routes.json
          key: indexnow-routes-${{ github.run_id }}
          restore-keys: indexnow-routes-

      - name: announce the changed routes, now that the key file is served
        run: node scripts/indexnow-ping.mjs dist --previous .indexnow-routes.json

      - name: say where it went
        run: echo "### Published to https://${{ vars.CLOUDFLARE_PAGES_PROJECT }}.pages.dev" >> "$GITHUB_STEP_SUMMARY"
