name: ci

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: site

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: build, generate headers, measure budgets
        run: npm run build

      - name: restore the route set last announced to indexnow
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: site/.indexnow-routes.json
          key: indexnow-routes-${{ github.run_id }}
          restore-keys: indexnow-routes-

      - name: ping indexnow when the dist route set changed
        if: github.ref == 'refs/heads/main'
        run: node scripts/indexnow-ping.mjs dist --previous .indexnow-routes.json
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - run: npm run gate:html
      - run: npm run gate:links
      - run: npm run gate:machine
      - run: npm run gate:skills
      - run: npm run gate:jsonld

      - name: visual snapshots and axe
        run: |
          npx playwright install --with-deps chromium
          npm run gate:visual

      - name: lighthouse mobile and desktop
        run: npm run gate:lh
        env:
          GATE_PHASE: ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-artifacts
          path: |
            site/.lighthouseci/lhr-*.json
            site/test-results/
            site/dist/gate-routes.json
          retention-days: 14

  regen-baselines:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --update-snapshots
      - name: Commit regenerated linux baselines
        run: |
          git config user.name 'baseline-bot'
          git config user.email 'baseline-bot@meshin.co'
          git add tests/__screenshots__/linux
          git commit -m 'test: regenerate linux baselines on the CI runner' || echo 'no changes'
          git push
