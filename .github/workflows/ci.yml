name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the whole graph against this ref, the way a push to main does, when the build a press needs was lost
        type: boolean
        default: false

defaults:
  run:
    working-directory: site

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch' || inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc

      - name: classify the diff, so prose cannot spend a Lighthouse matrix
        id: classify
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.sha }}
        run: node scripts/run-classify-diff.mjs --before "$BEFORE" --after "$AFTER" >> "$GITHUB_OUTPUT"

  build:
    if: (github.event_name != 'workflow_dispatch' || inputs.full) && needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: build, generate headers, measure budgets
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: site/dist
          retention-days: 14
          include-hidden-files: true

  types-and-units:
    if: github.event_name != 'workflow_dispatch' || inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: fetch main, the base the spec gate falls back to on a new branch
        run: git fetch --no-tags origin main:refs/remotes/origin/main || true
      - run: npm run check
      - run: npm test
      - run: npm run gate:skills
      - run: npm run gate:plan
      - run: npm run gate:docs
      - run: npm run gate:evidence
      - run: npm run gate:demand
      - run: npm run gate:keywords
      - run: npm run gate:autowriter
      - run: npm run gate:engine
      - run: npm run gate:partition
      - run: npm run gate:schedule
      - run: npm run gate:spec
        env:
          SPEC_GATE_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
      - run: npm run gate:brand

  cheap-gates:
    if: (github.event_name != 'workflow_dispatch' || inputs.full) && needs.changes.outputs.code == 'true'
    needs: [changes, build, types-and-units]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GATE_FINDINGS_DIR: ${{ github.workspace }}/gate-findings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: site/dist

      - run: npm run gate:html
      - run: npm run gate:links
      - run: npm run gate:content
      - run: npm run gate:human
      - run: npm run gate:orphans
      - run: npm run gate:machine
      - run: npm run gate:parity
      - run: npm run gate:agents
      - run: npm run gate:jsonld
      - run: npm run gate:external
      - run: npm run gate:search
      - run: npm run gate:editorial
      - run: npm run gate:registers

      - name: route set never shrinks unexplained
        run: npm run gate:routes

      - name: nothing the site loads is a paid service
        run: npm run gate:paid

      - name: Upload gate findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-findings-${{ github.run_attempt }}
          path: ${{ github.workspace }}/gate-findings/
          if-no-files-found: ignore
          retention-days: 14

  visual-and-axe:
    if: (github.event_name != 'workflow_dispatch' || inputs.full) && needs.changes.outputs.code == 'true'
    needs: [changes, build, types-and-units]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: site/dist
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run gate:visual -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-failures-${{ matrix.shard }}
          path: site/test-results/
          retention-days: 14

  deploy-preview:
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    needs: [changes, build, types-and-units, cheap-gates, visual-and-axe]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci

      - name: publish the very bytes the gates measured, never a second build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: site/dist

      - name: deploy a preview for this pull request
        id: preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -o pipefail
          node scripts/run-deploy.mjs --preview "pr-${{ github.event.number }}" | tee deploy.log
          url="$(sed -n 's/^deploy: url=//p' deploy.log | tail -1)"
          [ -n "$url" ] || { echo "DEPLOY the deploy printed no address"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: wait for the certificate on a host Cloudflare has not served before
        shell: bash
        run: |
          for attempt in $(seq 1 20); do
            if curl -sSf -o /dev/null --max-time 15 "${{ steps.preview.outputs.url }}/"; then
              echo "reachable after $attempt attempt(s)"
              exit 0
            fi
            sleep 15
          done
          echo "DEPLOY ${{ steps.preview.outputs.url }} never answered"
          exit 1

      - name: smoke the preview origin, because only a live response proves the headers
        run: npm run smoke:prod "${{ steps.preview.outputs.url }}"

      - name: tell the pull request where to look
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            const body = `Preview: ${url}\n\nThese are the bytes the gates measured. \`*.pages.dev\` is served \`noindex\`.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const mine = comments.data.find((c) => c.user.type === 'Bot' && c.body.startsWith('Preview: '));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  cancel-on-failure:
    if: failure()
    needs: [build, types-and-units, cheap-gates, visual-and-axe]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cancel-run

  all-required-jobs-passed:
    name: ${{ github.event_name == 'pull_request' && 'all required jobs passed' || format('all required jobs passed ({0})', github.event_name) }}
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.full)
    needs: [changes, build, types-and-units, cheap-gates, visual-and-axe, deploy-preview]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc

      - name: decide from every dependency's own result, so a skip or a cancel cannot read as a pass
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-aggregate.mjs

  regen-baselines:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run build
      - run: npm run gate:visual -- --update-snapshots
      - name: Commit regenerated linux baselines
        env:
          AUTOWRITER_PAT: ${{ secrets.AUTOWRITER_PAT }}
        run: |
          if [ -z "$AUTOWRITER_PAT" ]; then
            echo "::error::The secret AUTOWRITER_PAT is not set, so the regenerated baselines cannot be pushed as the bot; a push with the default token would leave the pull request's CI run held for approval."
            exit 1
          fi
          credential="$(printf 'x-access-token:%s' "$AUTOWRITER_PAT" | base64 | tr -d '\n')"
          echo "::add-mask::$credential"
          git config user.name 'baseline-bot'
          git config user.email "baseline-bot@$(node --input-type=module -e "import { brandFromDisk } from './src/utils/brand.mjs'; console.log(brandFromDisk().name)")"
          git add tests/__screenshots__/linux
          git commit -m 'test: regenerate linux baselines on the CI runner' || echo 'no changes'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $credential" pull --rebase origin "${GITHUB_REF_NAME}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $credential" push origin "HEAD:${GITHUB_REF_NAME}"
