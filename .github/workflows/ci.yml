name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: site

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: classify the diff, so prose cannot spend a Lighthouse matrix
        id: classify
        working-directory: .
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
            before="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          changed="$(git diff --name-only "$before" "${{ github.sha }}" || true)"
          echo "changed files:"
          echo "$changed"
          code=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/*|audits/*|site/.agents/*) ;;
              site/src/data/*) code=true ;;
              *.md) ;;
              */*) code=true ;;
              *) code=true ;;
            esac
          done <<< "$changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "build surface changed: $code"

  build:
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: build, generate headers, measure budgets
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: site/dist
          retention-days: 3
          include-hidden-files: true

  types-and-units:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run gate:skills
      - run: npm run gate:plan
      - run: npm run gate:docs
      - run: npm run gate:evidence
      - run: npm run gate:brand

  guard-mutations:
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: every guard proven able to fail
        run: npm run test:smoke

  cheap-gates:
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true'
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: site/dist

      - run: npm run gate:html
      - run: npm run gate:links
      - run: npm run gate:content
      - run: npm run gate:orphans
      - run: npm run gate:machine
      - run: npm run gate:jsonld
      - run: npm run gate:external
      - run: npm run gate:search
      - run: npm run gate:editorial
      - run: npm run gate:registers

      - name: route set never shrinks unexplained
        run: npm run gate:routes
        env:
          GATE_PHASE: ci

      - name: restore the route set last announced to indexnow
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: site/.indexnow-routes.json
          key: indexnow-routes-${{ github.run_id }}
          restore-keys: indexnow-routes-

      - name: ping indexnow when the dist route set changed
        if: github.ref == 'refs/heads/main'
        run: node scripts/indexnow-ping.mjs dist --previous .indexnow-routes.json
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

  visual-and-axe:
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true'
    needs: [changes, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: site/dist
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run gate:visual -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-failures-${{ matrix.shard }}
          path: site/test-results/
          retention-days: 14

  lighthouse:
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true'
    needs: [changes, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        form_factor: [mobile, desktop]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: site/dist

      - name: lighthouse ${{ matrix.form_factor }} shard ${{ matrix.shard }} of 4
        run: npm run gate:lh:one
        env:
          GATE_PHASE: ci
          LHCI_FORM_FACTOR: ${{ matrix.form_factor }}
          LH_SHARD_INDEX: ${{ matrix.shard }}
          LH_SHARD_TOTAL: 4

      - uses: actions/upload-artifact@v4
        with:
          name: lh-${{ matrix.form_factor }}-${{ matrix.shard }}
          path: audits/phase-ci/lh-${{ matrix.form_factor }}/
          retention-days: 14

  gate-report:
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true'
    needs: [changes, build, types-and-units, guard-mutations, cheap-gates, visual-and-axe, lighthouse]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: site/dist

      - uses: actions/download-artifact@v4
        with:
          pattern: lh-mobile-*
          merge-multiple: true
          path: audits/phase-ci/lh-mobile
      - uses: actions/download-artifact@v4
        with:
          pattern: lh-desktop-*
          merge-multiple: true
          path: audits/phase-ci/lh-desktop

      - name: every audited route reported once, from every shard
        run: node scripts/report.mjs ci ../audits/phase-ci

      - uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: audits/phase-ci/REPORT.md
          retention-days: 14

  regen-baselines:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run build
      - run: npx playwright test --update-snapshots
      - name: Commit regenerated linux baselines
        run: |
          git config user.name 'baseline-bot'
          git config user.email 'baseline-bot@meshin.co'
          git add tests/__screenshots__/linux
          git commit -m 'test: regenerate linux baselines on the CI runner' || echo 'no changes'
          git push
