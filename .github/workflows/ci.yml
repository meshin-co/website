name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: site

jobs:
  changes:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: classify the diff, so prose cannot spend a Lighthouse matrix
        id: classify
        working-directory: .
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
            before="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          changed="$(git diff --name-only "$before" "${{ github.sha }}" || true)"
          echo "changed files:"
          echo "$changed"
          code=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/*|audits/*|site/.agents/*|openspec/*) ;;
              site/src/data/*) code=true ;;
              *.md) ;;
              */*) code=true ;;
              *) code=true ;;
            esac
          done <<< "$changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "build surface changed: $code"

  build:
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: build, generate headers, measure budgets
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: site/dist
          retention-days: 3
          include-hidden-files: true

  types-and-units:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run gate:skills
      - run: npm run gate:plan
      - run: npm run gate:docs
      - run: npm run gate:evidence
      - run: npm run gate:spec
        env:
          SPEC_GATE_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
      - run: npm run gate:brand

  guard-mutations:
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - name: every guard proven able to fail
        run: npm run test:smoke

  cheap-gates:
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true'
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: site/dist

      - run: npm run gate:html
      - run: npm run gate:links
      - run: npm run gate:content
      - run: npm run gate:human
      - run: npm run gate:orphans
      - run: npm run gate:machine
      - run: npm run gate:jsonld
      - run: npm run gate:external
      - run: npm run gate:search
      - run: npm run gate:editorial
      - run: npm run gate:registers

      - name: route set never shrinks unexplained
        run: npm run gate:routes

  visual-and-axe:
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true'
    needs: [changes, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: site/dist
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run gate:visual -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-failures-${{ matrix.shard }}
          path: site/test-results/
          retention-days: 14

  lighthouse:
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true'
    needs: [changes, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        form_factor: [mobile, desktop]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: site/dist

      - name: lighthouse ${{ matrix.form_factor }} shard ${{ matrix.shard }} of 4
        run: npm run gate:lh:one
        env:
          GATE_PHASE: ci
          LHCI_FORM_FACTOR: ${{ matrix.form_factor }}
          LH_SHARD_INDEX: ${{ matrix.shard }}
          LH_SHARD_TOTAL: 4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lh-${{ matrix.form_factor }}-${{ matrix.shard }}
          path: audits/phase-ci/lh-${{ matrix.form_factor }}/
          retention-days: 14

  gate-report:
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.code == 'true'
    needs:
      [
        changes,
        build,
        types-and-units,
        guard-mutations,
        cheap-gates,
        visual-and-axe,
        lighthouse,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: site/dist

      - uses: actions/download-artifact@v4
        with:
          pattern: lh-mobile-*
          merge-multiple: true
          path: audits/phase-ci/lh-mobile
      - uses: actions/download-artifact@v4
        with:
          pattern: lh-desktop-*
          merge-multiple: true
          path: audits/phase-ci/lh-desktop

      - name: every audited route reported once, from every shard
        run: node scripts/report.mjs ci ../audits/phase-ci

      - uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: audits/phase-ci/REPORT.md
          retention-days: 14
  deploy-preview:
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    needs: [changes, gate-report]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci

      - name: publish the very bytes the gates measured, never a second build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: site/dist

      - name: deploy a preview for this pull request
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          node scripts/run-deploy.mjs --preview "pr-${{ github.event.number }}" | tee deploy.log
          url="$(grep -o 'https://[a-z0-9-]*\.pages\.dev' deploy.log | tail -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: smoke the preview origin, because only a live response proves the headers
        run: npm run smoke:prod "${{ steps.preview.outputs.url }}"

      - name: tell the pull request where to look
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            const body = `Preview: ${url}\n\nThese are the bytes the gates measured. \`*.pages.dev\` is served \`noindex\`.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const mine = comments.data.find((c) => c.user.type === 'Bot' && c.body.startsWith('Preview: '));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  regen-baselines:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run build
      - run: npx playwright test --update-snapshots
      - name: Commit regenerated linux baselines
        run: |
          git config user.name 'baseline-bot'
          git config user.email 'baseline-bot@meshin.co'
          git add tests/__screenshots__/linux
          git commit -m 'test: regenerate linux baselines on the CI runner' || echo 'no changes'
          git push
