name: ci

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: site

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: build, generate headers, measure budgets
        run: npm run build

      - run: npm run gate:html
      - run: npm run gate:links
      - run: npm run gate:machine
      - run: npm run gate:jsonld

      - name: visual snapshots and axe
        run: |
          npx playwright install --with-deps chromium
          npm run gate:visual

      - name: lighthouse mobile and desktop
        run: npm run gate:lh
        env:
          GATE_PHASE: ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-artifacts
          path: |
            site/.lighthouseci/lhr-*.json
            site/test-results/
            site/dist/gate-routes.json
          retention-days: 14
